<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おみくじアプリ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background-color: #f5f0e8;
      transition: background-color 0.6s ease;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2rem;
      color: #333;
      margin-bottom: 1.5rem;
    }

    .result-area {
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      margin-bottom: 2rem;
    }

    .result-text {
      font-size: 5rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transform: scale(0.3);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .result-text.show {
      opacity: 1;
      transform: scale(1);
    }

    .result-message {
      font-size: 1.2rem;
      color: #fff;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.3);
      margin-top: 1rem;
      opacity: 0;
      transition: opacity 0.5s ease 0.3s;
    }

    .result-message.show {
      opacity: 1;
    }

    .draw-button {
      font-size: 1.4rem;
      padding: 1rem 3rem;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      font-family: inherit;
    }

    .draw-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(231, 76, 60, 0.5);
    }

    .draw-button:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(231, 76, 60, 0.3);
    }

    .draw-button.spinning {
      pointer-events: none;
      animation: shake 0.4s ease-in-out 3;
    }

    @keyframes shake {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-8deg); }
      75% { transform: rotate(8deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>おみくじ</h1>
    <div class="result-area">
      <div class="result-text" id="resultText"></div>
      <div class="result-message" id="resultMessage"></div>
    </div>
    <button class="draw-button" id="drawButton">おみくじを引く</button>
  </div>

  <script>
    const fortunes = [
      { label: "大吉", color: "#e74c3c", message: "最高の運勢！何をしても上手くいく日です" },
      { label: "吉",   color: "#e67e22", message: "良い運勢です。積極的に行動しましょう" },
      { label: "中吉", color: "#f1c40f", message: "まずまずの運勢。穏やかに過ごせます" },
      { label: "小吉", color: "#2ecc71", message: "小さな幸せが見つかる日です" },
      { label: "末吉", color: "#1abc9c", message: "じわじわと運気が上がっていきます" },
      { label: "凶",   color: "#8e44ad", message: "慎重に過ごしましょう。明日はきっと良い日" },
      { label: "大凶", color: "#2c3e50", message: "今日が底！あとは上がるだけです" },
    ];

    const weights = [10, 20, 20, 20, 15, 10, 5];

    function weightedRandom() {
      const total = weights.reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      for (let i = 0; i < weights.length; i++) {
        r -= weights[i];
        if (r <= 0) return i;
      }
      return weights.length - 1;
    }

    const button = document.getElementById("drawButton");
    const resultText = document.getElementById("resultText");
    const resultMessage = document.getElementById("resultMessage");

    button.addEventListener("click", () => {
      resultText.classList.remove("show");
      resultMessage.classList.remove("show");
      button.classList.add("spinning");

      setTimeout(() => {
        const fortune = fortunes[weightedRandom()];

        document.body.style.backgroundColor = fortune.color;
        resultText.textContent = fortune.label;
        resultMessage.textContent = fortune.message;

        resultText.classList.add("show");
        resultMessage.classList.add("show");
        button.classList.remove("spinning");
      }, 1200);
    });
  </script>
</body>
</html>
